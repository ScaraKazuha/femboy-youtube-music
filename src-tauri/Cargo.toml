[package]
name = "femboy-youtube-music"
version = "0.2.0"
description = "An unofficial, lightweight YouTube Music desktop wrapper"
authors = ["Femboy YouTube Music contributors"]
edition = "2021"
rust-version = "1.88"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Used by tauri::generate_context! to embed the plugin configuration.
serde_json = "1"
webbrowser = "1"
url = "2"
